name: Academy backend checks
on:
  pull_request:
  push:
    branches: ['fix/academy-backend', 'feature/academy-student-journey', 'feature/academy-group-lessons', 'feature/academy-teacher-workspace', 'feature/academy-dashboards-checklists']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: academy_test
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'academy_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ci_only_password
      ACADEMY_TEST_DATABASE: ${{ matrix.database }}
      SESSION_DRIVER: array
      CACHE_DRIVER: array
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, curl, fileinfo, gd, bcmath, xml, zip, intl
          tools: composer:v2
          coverage: none
      - name: Verify original frontend assets are untouched
        run: git diff --exit-code 9a35872dd0a2942f7b0ffafaf35a37c9476f2465 HEAD -- public resources/js resources/css resources/sass
      - name: Lint backend
        run: |
          git diff --name-only --diff-filter=ACMR 95b17a73cad638d5db367937f9350d338a899e73 HEAD -- '*.php' | while IFS= read -r file; do php -l "$file" || exit 1; done
      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
      - name: Check preview updater syntax
        run: |
          bash -n scripts/preview-academy.sh
          python3 tests/scripts/test_preview_academy.py
      - name: Compile academy Blade templates
        run: |
          php artisan view:cache
      - name: Test academy backend
        run: php artisan test --filter=AcademyBackendTest


      - name: Export isolated browser database
        if: matrix.database == 'sqlite'
        run: ACADEMY_BROWSER_EXPORT=1 php artisan test --filter=test_export_isolated_browser_fixture_when_explicitly_requested_in_ci
      - uses: actions/setup-node@v4
        if: matrix.database == 'sqlite'
        with:
          node-version: '22'
      - name: Build current client code for browser preview
        if: matrix.database == 'sqlite'
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run production
      - name: Run real browser academy smoke flows
        if: matrix.database == 'sqlite'
        run: |
          npm install --prefix /tmp/academy-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/academy-browser/node_modules/.bin/playwright install --with-deps chromium
          touch storage/installed
          APP_ENV=local APP_DEBUG=false DB_DATABASE=/tmp/academy-browser.sqlite SESSION_DRIVER=file CACHE_DRIVER=array QUEUE_CONNECTION=sync QUEUE_DRIVER=sync APP_URL=http://127.0.0.1:8000 php -S 127.0.0.1:8000 -t public > /tmp/academy-browser-server.log 2>&1 &
          for attempt in $(seq 1 20); do curl -sf http://127.0.0.1:8000/login > /dev/null && break; sleep 1; done
          NODE_PATH=/tmp/academy-browser/node_modules node tests/browser/academy-smoke.cjs
      - name: Show isolated preview error summaries
        if: always() && matrix.database == 'sqlite'
        run: |
          python3 - <<'PYERROR'
          from pathlib import Path
          for path in Path('storage/logs').glob('laravel*.log'):
              lines = [line.split(' {"exception":')[0] for line in path.read_text(errors='replace').splitlines() if '.ERROR:' in line]
              for line in lines[-6:]: print(line[:1000])
          PYERROR
      - uses: actions/upload-artifact@v4
        if: always() && matrix.database == 'sqlite'
        with:
          name: academy-browser-evidence
          path: tests/browser/artifacts/
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Mix toolchain
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test notice form submission and network errors
        run: node tests/browser/notice-form.test.cjs
      - name: Build existing frontend without publishing assets
        run: |
          # Diagnostic output only; no change to application styles or compilation rules.
          echo "require('laravel-mix').webpackConfig({stats: {children: true}});" >> webpack.mix.js
          npm run production
      - name: Summarize dependency advisories for review
        run: |
          npm audit --json > /tmp/academy-npm-audit.json || true
          node -e "const r=require('/tmp/academy-npm-audit.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities || r.error || {unavailable:true}));"
